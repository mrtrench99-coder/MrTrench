services:
  - type: web
    name: mrtrench
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python web_app.py
    healthCheckPath: /api/auth/session
    envVars:
      - key: MR_TRENCH_MODE
        value: hosted
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: MR_TRENCH_ENCRYPTION_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:mrtrench99@gmail.com
